# electron-builder configuration for Amazon AI Ops Desktop
appId: com.amazon-ai-ops.desktop
productName: AmazonAIOpsAgent
copyright: Copyright © 2026 Amazon AI Ops

directories:
  output: release
  buildResources: build

files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/renderer/**/*
  - playwright-browsers/**/*
  - package.json
  - "!dist/**/*.map"
  - "!node_modules/better-sqlite3/deps/**/*"
  - "!node_modules/better-sqlite3/src/**/*"
  - "!node_modules/duckdb/build/**/*"
  - "!node_modules/duckdb/scripts/**/*"
  - "!node_modules/duckdb/src/**/*"
  - "!node_modules/duckdb/vendor/**/*"
  - "!node_modules/duckdb/binding.gyp.in"
  - "!node_modules/duckdb/Makefile"

extraResources:
  - from: ../../resources
    to: resources

extraMetadata:
  main: dist/main/index.js

win:
  target:
    - target: dir
      arch:
        - x64
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  artifactName: ${productName}-${version}.${ext}
  signAndEditExecutable: false

nsis: {}

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.business

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Office

publish: null

electronLanguages:
  - en-US
  - zh-CN

asar: false

npmRebuild: false
