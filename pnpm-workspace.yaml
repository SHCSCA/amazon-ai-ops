packages:
  - 'apps/*'
  - 'packages/*'
allowBuilds:
  better-sqlite3: true
  duckdb: true
  electron: true
  electron-winstaller: true
  esbuild: true
onlyBuiltDependencies:
  - better-sqlite3
  - electron
  - esbuild

overrides:
  'tar@<7.5.21': '7.5.21'
  'brace-expansion@1': '1.1.21'
  'brace-expansion@2': '2.1.7'
  'ip-address@<10.7.1': '10.7.1'
  'http-cache-semantics@<4.3.0': '4.3.0'
